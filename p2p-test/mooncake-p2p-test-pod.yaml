# =============================================================================
# p2p-test/mooncake-p2p-test-pod.yaml
# Mooncake P2P Store 测试 Pod（基于你验证过的 mooncake-build-0310.yaml 改造）
#
# 与 v0310 的区别：
#  - 镜像：mooncake-p2p-test:latest（GCC 11，能编 store）
#  - Pod 名：mooncake-p2p-test
#  - command 改为直接跑构建+测试（也可改 sleep infinity 交互式调试）
#
# 部署：
#   podman save localhost/mooncake-p2p-test:latest -o /tmp/mooncake-p2p-test.tar
#   sudo ctr -n k8s.io images import /tmp/mooncake-p2p-test.tar
#   kubectl apply -f p2p-test/mooncake-p2p-test-pod.yaml
#   kubectl logs -f mooncake-p2p-test
# =============================================================================
---
apiVersion: v1
kind: Pod
metadata:
  name: mooncake-p2p-test
  labels:
    app: mooncake-p2p-test
spec:
  containers:
    - name: mooncake
      image: localhost/mooncake-p2p-test:latest
      imagePullPolicy: Never
      workingDir: /workspace/Mooncake
      # ---- 直接跑构建+测试（改 sleep infinity 可交互式调试） ----
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -ex
          # 启用 gcc-toolset-12（容器内 GCC 12，不影响宿主机）
          source /opt/rh/gcc-toolset-12/enable
          gcc --version
          # 加载 CANN 环境（每次新 shell 必须）
          source /usr/local/Ascend/ascend-toolkit/set_env.sh 2>/dev/null || true
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH

          cd /workspace/Mooncake
          git submodule update --init --recursive

          rm -rf build && mkdir build && cd build
          cmake .. \
            -DUSE_ASCEND_CACHE_TIER=ON \
            -DUSE_ASCEND_DRAM_TIER=ON \
            -DWITH_STORE=ON \
            -DWITH_P2P_STORE=ON \
            -DUSE_HTTP=ON \
            -DBUILD_UNIT_TESTS=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

          # 只构建 PR 改的两个测试目标（省时间）
          cmake --build . --target peer_client_test p2p_client_integration_test -j$(nproc)

          echo "===== Build OK, running tests ====="
          # 注意：测试二进制在 build/mooncake-store/tests/p2p/ 下
          ./mooncake-store/tests/p2p/peer_client_test 2>&1 | tee /tmp/peer_client_test.log
          echo "===== peer_client_test done ====="
          ./mooncake-store/tests/p2p/p2p_client_integration_test 2>&1 | tee /tmp/p2p_integration_test.log
          echo "===== p2p_client_integration_test done ====="

      # ---- 必须 privileged：容器内驱动访问 NPU 设备需要特权 ----
      securityContext:
        privileged: true

      env:
        - name: ASCEND_HOME_PATH
          value: "/usr/local/Ascend/ascend-toolkit/latest"
        - name: CMAKE_PREFIX_PATH
          value: "/usr/local"

      # ---- 挂载整个 CANN 目录（只读，保证符号链接完整解析） ----
      volumeMounts:
        - name: ascend
          mountPath: /usr/local/Ascend
          readOnly: true
        - name: hccn-conf
          mountPath: /etc/hccn.conf
          readOnly: true
        # ---- NPU 设备（单卡即可，本 PR 测试用 TCP 传输，不直接走 NPU） ----
        - name: npu-dev0
          mountPath: /dev/davinci0
        - name: npu-devmanage
          mountPath: /dev/devmm_svm
        - name: npu-hdc
          mountPath: /dev/hisi_hdc
        - name: npu-mgmt
          mountPath: /dev/davinci_manager
        # ---- 代码目录（宿主机先 clone 你的 fork 到 /data/mooncake-src） ----
        - name: code
          mountPath: /workspace/Mooncake

  volumes:
    - name: ascend
      hostPath:
        path: /usr/local/Ascend
        type: Directory
    - name: hccn-conf
      hostPath:
        path: /etc/hccn.conf
        type: FileOrCreate
    - name: npu-dev0
      hostPath:
        path: /dev/davinci0
        type: CharDevice
    - name: npu-devmanage
      hostPath:
        path: /dev/devmm_svm
        type: CharDevice
    - name: npu-hdc
      hostPath:
        path: /dev/hisi_hdc
        type: CharDevice
    - name: npu-mgmt
      hostPath:
        path: /dev/davinci_manager
        type: CharDevice
    # ---- 代码：宿主机 git clone 你的 fork 到这个目录 ----
    - name: code
      hostPath:
        path: /data/mooncake-src
        type: Directory

  restartPolicy: Never
