# =============================================================================
# v0310/mooncake-build-0310.yaml
# Mooncake v0.3.10 编译 Pod（openEuler + Ascend 910B，与新版完全隔离）
#
# 隔离设计：
#  - 镜像名：localhost/mooncake-v0310:latest（新版是 mooncake-openeuler）
#  - Pod 名：mooncake-build-0310（新版是 mooncake-build-910b）
#  - 源码克隆到 /workspace/mooncake-v0310（新版是 /workspace/mooncake_me）
#
# 部署：kubectl apply -f v0310/mooncake-build-0310.yaml
# 进入：kubectl exec -it mooncake-build-0310 -- /bin/bash
#
# 关键点（踩坑总结）：
#  - 必须 securityContext.privileged: true：容器内驱动访问 NPU 设备需要特权，
#    否则运行报 "get platform info failed, drvErr=4" / "Failed to initialize ACL"。
#  - 双卡测试：hostPath 挂 davinci0/1 + resources 申请 huawei.com/Ascend910: "2"
#    （需集群已装 Ascend device plugin；未装可去掉 resources 只用 hostPath）。
#  - Pod 是临时的：重建后 /workspace 源码和编译产物会丢，需重新 clone + 编译。
# =============================================================================
---
apiVersion: v1
kind: Pod
metadata:
  name: mooncake-build-0310
  labels:
    app: mooncake-build
    version: v0.3.10
spec:
  # ---- 如需 RDMA 传输测试，取消下面两行注释 ----
  # hostNetwork: true
  # dnsPolicy: ClusterFirstWithHostNet

  containers:
    - name: mooncake
      image: localhost/mooncake-v0310:latest
      imagePullPolicy: Never
      command: ["/bin/bash", "-c", "sleep infinity"]
      workingDir: /workspace

      # ---- 必须 privileged：容器内驱动访问 NPU 设备需要特权，
      #      否则运行时报 get platform info failed, drvErr=4 / aclInit 失败 ----
      securityContext:
        privileged: true

      env:
        - name: ASCEND_HOME_PATH
          value: "/usr/local/Ascend/ascend-toolkit/latest"
        - name: CMAKE_PREFIX_PATH
          value: "/usr/local"

      # ---- 挂载整个 CANN 目录（只读，保证符号链接完整解析）----
      volumeMounts:
        - name: ascend
          mountPath: /usr/local/Ascend
          readOnly: true
        - name: hccn-conf
          mountPath: /etc/hccn.conf
          readOnly: true
        # ---- 双卡 NPU 运行时测试 ----
        - name: npu-dev0
          mountPath: /dev/davinci0
        - name: npu-dev1
          mountPath: /dev/davinci1
        - name: npu-hdc
          mountPath: /dev/hisi_hdc
        - name: npu-mgmt
          mountPath: /dev/davinci_manager
      resources:
        limits:
          huawei.com/Ascend910: "2"
        requests:
          huawei.com/Ascend910: "2"

  volumes:
    - name: ascend
      hostPath:
        path: /usr/local/Ascend
        type: Directory
    - name: hccn-conf
      hostPath:
        path: /etc/hccn.conf
        type: FileOrCreate
    - name: npu-dev0
      hostPath:
        path: /dev/davinci0
        type: CharDevice
    - name: npu-dev1
      hostPath:
        path: /dev/davinci1
        type: CharDevice
    - name: npu-hdc
      hostPath:
        path: /dev/hisi_hdc
        type: CharDevice
    - name: npu-mgmt
      hostPath:
        path: /dev/davinci_manager
        type: CharDevice

  restartPolicy: Never
